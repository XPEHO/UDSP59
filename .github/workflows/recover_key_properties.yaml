name: Recover KEY_PROPERTIES secret
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Dump KEY_PROPERTIES to artifact
    runs-on: ubuntu-latest
    steps:
      - name: Write secret (already base64-encoded) to file
        run: echo "${{ secrets.KEY_PROPERTIES }}" > key_properties.b64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: key-properties-recovery
          path: key_properties.b64
          retention-days: 1
